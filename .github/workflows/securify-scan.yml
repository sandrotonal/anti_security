name: Securify Security Scan

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  pull-requests: write

jobs:
  securify-scan:
    name: Secret Scanning
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: |
          npm ci
          npm install -g securify-scanner || echo "Installing from source"
      
      - name: Run Securify Scanner
        id: scan
        run: |
          mkdir -p scan-results
          node bin/securify.mjs scan . --format sarif --output scan-results/securify.sarif --exclude "src/components/SecurifySimulator.tsx" --exclude "src/components/SecurifySandbox.tsx" --exclude "src/lib/onboarding.ts" --exclude "src/components/GitHubNativeSecuritySuite.tsx" --exclude "src/components/TerminalModal.tsx" || true
          node bin/securify.mjs scan . --format json --output scan-results/findings.json --exclude "src/components/SecurifySimulator.tsx" --exclude "src/components/SecurifySandbox.tsx" --exclude "src/lib/onboarding.ts" --exclude "src/components/GitHubNativeSecuritySuite.tsx" --exclude "src/components/TerminalModal.tsx" || true
          node bin/securify.mjs scan . --format markdown --output scan-results/report.md || true
      
      - name: Upload SARIF to GitHub Security
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: scan-results/securify.sarif
          category: securify-secrets
      
      - name: Comment on PR
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            if (!fs.existsSync('scan-results/findings.json')) return;
            const raw = JSON.parse(fs.readFileSync('scan-results/findings.json', 'utf-8'));
            const stats = raw.summary || { critical: 0, high: 0, medium: 0, low: 0 };
            const findings = raw.findings || [];
            
            const total = stats.critical + stats.high + stats.medium + stats.low;
            const status = (stats.critical > 0 || stats.high > 0) ? '❌' : '✅';
            
            let comment = `## ${status} Securify Security Scan Results\n\n`;
            comment += `**Total Findings:** ${total}\n`;
            comment += `- 🔴 Critical: ${stats.critical}\n`;
            comment += `- 🟠 High: ${stats.high}\n`;
            comment += `- 🟡 Medium: ${stats.medium}\n`;
            comment += `- 🔵 Low: ${stats.low}\n\n`;
            
            if (total > 0) {
              comment += `### Top Findings:\n`;
              findings.slice(0, 5).forEach(f => {
                comment += `- **${f.type}** in \`${f.file}:${f.line}\`\n`;
              });
            } else {
              comment += `✅ No secrets detected! Your code is secure.\n`;
            }
            
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: comment
            });
      
      - name: Upload Results Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: securify-scan-results
          path: scan-results/
          retention-days: 30
      
      - name: Fail if Critical/High Findings
        if: steps.scan.outcome == 'failure'
        run: |
          echo "::error::Critical or High severity secrets detected!"
          exit 1
